
name: Build LEXIPOP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: unzip -o LEXIPOP-Android-Studio-Project.zip -d .

      - name: Build APK
        working-directory: LEXIPOP-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEXIPOP-debug-APK
          path: LEXIPOP-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
